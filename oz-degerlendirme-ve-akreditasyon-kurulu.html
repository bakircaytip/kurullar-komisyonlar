<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

:root {
    --bc-primary: #00a5b5;
    --bc-secondary: #025860;
    --bc-dark: #1f2937;
    --bc-light: #f8fafc;
}

.bc-panel {
    max-width: 1400px;
    margin: 30px auto;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.15);
}

.bc-header {
    position: relative;
    padding: 20px 25px;
    color: white;
    overflow: hidden;
}

.bc-header::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #00a5b5, #025860);
    z-index: 1;
}

.bc-header::after {
    content: "";
    position: absolute;
    inset: 0;
    backdrop-filter: blur(12px);
    background: rgba(255,255,255,0.05);
    z-index: 2;
}

.bc-header-content {
    position: relative;
    z-index: 3;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.bc-title {
    font-size: 1.2em;
    font-weight: 600;
}

.bc-header-right {
    display: flex;
    align-items: center;
    gap: 15px;
}

.bc-logo {
    height: 60px;
}

.bc-home-btn {
    padding: 8px 16px;
    background: rgba(255,255,255,0.15);
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-size: 0.85em;
}

.bc-body {
    display: flex;
    min-height: 650px;
    background: white;
}

.bc-sidebar {
    width: 300px;
    background: var(--bc-dark);
    display: flex;
    flex-direction: column;
}

.bc-menu-btn {
    padding: 18px 22px;
    color: #d1d5db;
    background: none;
    border: none;
    text-align: left;
    cursor: pointer;
}

.bc-menu-btn:hover {
    background: rgba(255,255,255,0.05);
    color: white;
}

.bc-menu-btn.active {
    background: var(--bc-primary);
    color: white;
}

.bc-content {
    flex: 1;
    background: var(--bc-light);
    display: flex;
    flex-direction: column;
}

.bc-content-header {
    padding: 18px 25px;
    background: white;
    border-bottom: 1px solid #e5e7eb;
    font-weight: 600;
    color: var(--bc-primary);
}

.bc-iframe {
    flex: 1;
    border: none;
}
</style>
</head>

data-content="<p><b>Temel Çalışma İlkeleri ve Süreçler</b></p>
<li><b>Gönüllülük Esası:</b> Akreditasyon süreci, kuruluşların kendi istekleriyle katıldıkları bir iyileştirme ve tanınırlık faaliyetidir.</li><br>
<li><b>Kanıta Dayalı Değerlendirme:</b> Öz değerlendirme raporları (ÖDR) ve kurum incelemeleri, somut verilere, dokümanlara ve kanıtlara dayandırılır.</li><br>
<li><b>Sürekli İyileştirme (PDCA):</b> Öz değerlendirme tek seferlik bir işlem değil, devamlılığı olan bir döngüdür (Planla-Uygula-Kontrol Et-Önlem Al).</li><br>
<li><b>Etik ve Tarafsızlık:</b> Değerlendirme sürecinde çıkar çatışması bulunmamalı, değerlendiriciler tarafsız olmalı ve gizlilik prensiplerine uymalıdır.</li><br>
<li><b>Öz Değerlendirme Raporu (ÖDR) Hazırlığı:</b> Kurumlar, akreditasyon kurulu tarafından belirlenen şablonlara göre detaylı bir öz değerlendirme raporu hazırlar.</li><br>
<li><b>Ziyaret ve İnceleme:</b> Kurul, uzman ziyaret ekipleri aracılığıyla yerinde inceleme yaparak raporun doğruluğunu teyit eder.</li><br>
<li><b>Kurumsal Yetkinlik:</b> Değerlendirme süreci, kurumun yönetim kalitesini artırmayı ve akademik/idari standartlarını yükseltmeyi hedefler.</li><br>
">

<script>
const buttons = document.querySelectorAll(".bc-menu-btn");
const iframe = document.getElementById("iframe");
const title = document.getElementById("contentTitle");

buttons.forEach(btn => {
    btn.addEventListener("click", () => {

        buttons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        const url = btn.getAttribute("data-url");
        const content = btn.getAttribute("data-content");
        const text = btn.getAttribute("data-title");

        if (content) {
            const html = `
            <html>
            <head>
                <meta charset="UTF-8">
                <style>
                    body { font-family: Inter; padding: 40px; }
                </style>
            </head>
            <body>${content}</body>
            </html>`;
            iframe.src = "data:text/html;charset=utf-8," + encodeURIComponent(html);
        } else {
            iframe.src = url;
        }

        title.innerText = text;
    });
});

document.querySelector(".bc-menu-btn.active").click();
</script>
