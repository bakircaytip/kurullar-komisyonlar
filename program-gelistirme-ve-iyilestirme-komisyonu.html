<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

:root {
    --bc-primary: #00a5b5;
    --bc-secondary: #025860;
    --bc-dark: #1f2937;
    --bc-light: #f8fafc;
}

.bc-panel {
    max-width: 1400px;
    margin: 30px auto;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.15);
}

.bc-header {
    position: relative;
    padding: 20px 25px;
    color: white;
    overflow: hidden;
}

.bc-header::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #00a5b5, #025860);
    z-index: 1;
}

.bc-header::after {
    content: "";
    position: absolute;
    inset: 0;
    backdrop-filter: blur(12px);
    background: rgba(255,255,255,0.05);
    z-index: 2;
}

.bc-header-content {
    position: relative;
    z-index: 3;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.bc-title {
    font-size: 1.2em;
    font-weight: 600;
}

.bc-header-right {
    display: flex;
    align-items: center;
    gap: 15px;
}

.bc-logo {
    height: 60px;
}

.bc-home-btn {
    padding: 8px 16px;
    background: rgba(255,255,255,0.15);
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-size: 0.85em;
}

.bc-body {
    display: flex;
    min-height: 650px;
    background: white;
}

.bc-sidebar {
    width: 300px;
    background: var(--bc-dark);
    display: flex;
    flex-direction: column;
}

.bc-menu-btn {
    padding: 18px 22px;
    color: #d1d5db;
    background: none;
    border: none;
    text-align: left;
    cursor: pointer;
}

.bc-menu-btn:hover {
    background: rgba(255,255,255,0.05);
    color: white;
}

.bc-menu-btn.active {
    background: var(--bc-primary);
    color: white;
}

.bc-content {
    flex: 1;
    background: var(--bc-light);
    display: flex;
    flex-direction: column;
}

.bc-content-header {
    padding: 18px 25px;
    background: white;
    border-bottom: 1px solid #e5e7eb;
    font-weight: 600;
    color: var(--bc-primary);
}

.bc-iframe {
    flex: 1;
    border: none;
}
</style>
</head>

     <li><b>Programı Güncelleme:</b> Eğitim programının hedeflerini, içeriğini, öğretim yöntemlerini ve ölçme-değerlendirme yöntemlerini çağdaş gelişmeler doğrultusunda günceller.</li><br>
     <li><b>Akreditasyon Çalışmaları:</b> Kurumun ulusal veya uluslararası standartlara ulaşması için gerekli program iyileştirmelerini yapar.</li><br>

<button class="bc-menu-btn"

data-content="<p><b>Temel Çalışma Esasları</b></p><br>
<li><b>İhtiyaç Analizi Odaklılık:</b> Çalışmalar, toplumun, bireyin, sektörün ve konu alanının ihtiyaç ve beklentilerini belirleyen verilerin toplanmasıyla başlar.</li><br>
<li><b>Dinamik Yapı:</b> Program geliştirme, programın dört temel ögesi olan hedef, içerik, eğitim durumları ve değerlendirme arasındaki dinamik ilişkiyi sürekli güncel tutar.</li><br>
<li><b>Kanıta Dayalı İyileştirme:</b> Programdaki iyileştirmeler, eğitim-öğretim sürecinden elde edilen verilerin (öğrenci geri bildirimleri, sınav sonuçları vb.) analizine dayanır.</li><br>
<li><b>Paydaş Katılımı:</b> Eğitim programlarının hazırlanması ve güncellenmesi sürecine öğretim elemanları, öğrenciler, mezunlar ve dış paydaşlar dahil edilir.</li><br>
<p><b>Süreç ve Toplantı İlkeleri</b></p><br>
<li><b>Planlı Toplantılar:</b> Komisyonlar, genellikle eğitim-öğretim yılı içinde belirli aralıklarla (örneğin en az dört kez) düzenli toplanır.</li><br>
<li><b>Yönergeye Bağlılık:</b> Çalışmalar, kurumun belirlediği program geliştirme yönergesi ve çalışma esaslarına göre yürütülür.</li><br>
<li><b>Alt Komisyonlarla İşbirliği:</b> İhtiyaç halinde alt kurullar veya çalışma grupları oluşturularak süreç alt bileşenlere (içerik, ölçme-değerlendirme vb.) bölünür.</li><br>
<p><b>Program Geliştirme Aşamaları</b></p><br>
<li><b>Hedef Belirleme:</b> Programın amaçları ve kazandırılacak davranışlar netleştirilir.</li><br>
<li><b>İçerik Düzenleme:</b> İçerik, ardışık, sıralı ve esnek bir yaklaşımla yapılandırılır.</li><br>
<li><b>Eğitim Durumları:</b> Öğrenme yaşantıları ve öğretim yöntemleri belirlenir.</li><br>
<li><b>Değerlendirme:</b> Programın etkililiği ölçülür ve iyileştirme önerileri geliştirilir.</li><br>

<div class="bc-content">
<div class="bc-content-header" id="contentTitle">Komisyon Hakkında</div>
<iframe id="iframe" class="bc-iframe"></iframe>
</div>

</div>
</div>

<script>
const buttons = document.querySelectorAll(".bc-menu-btn");
const iframe = document.getElementById("iframe");
const title = document.getElementById("contentTitle");

buttons.forEach(btn => {
    btn.addEventListener("click", () => {

        buttons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        const url = btn.getAttribute("data-url");
        const content = btn.getAttribute("data-content");
        const text = btn.getAttribute("data-title");

        if (content) {
            const html = `
            <html>
            <head>
                <meta charset="UTF-8">
                <style>
                    body { font-family: Inter; padding: 40px; }
                </style>
            </head>
            <body>${content}</body>
            </html>`;
            iframe.src = "data:text/html;charset=utf-8," + encodeURIComponent(html);
        } else {
            iframe.src = url;
        }

        title.innerText = text;
    });
});

document.querySelector(".bc-menu-btn.active").click();
</script>
