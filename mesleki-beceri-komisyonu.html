<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mesleki Beceri Komisyonu</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

:root {
    --bc-primary: #00a5b5;
    --bc-secondary: #025860;
    --bc-dark: #1f2937;
    --bc-light: #f8fafc;
}

.bc-panel {
    max-width: 1400px;
    margin: 30px auto;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.15);
}

.bc-header {
    position: relative;
    padding: 20px 25px;
    color: white;
    overflow: hidden;
}

.bc-header::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #00a5b5, #025860);
    z-index: 1;
}

.bc-header::after {
    content: "";
    position: absolute;
    inset: 0;
    backdrop-filter: blur(12px);
    background: rgba(255,255,255,0.05);
    z-index: 2;
}

.bc-header-content {
    position: relative;
    z-index: 3;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.bc-title {
    font-size: 1.2em;
    font-weight: 600;
}

.bc-header-right {
    display: flex;
    align-items: center;
    gap: 15px;
}

.bc-logo {
    height: 60px;
}

.bc-home-btn {
    padding: 8px 16px;
    background: rgba(255,255,255,0.15);
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-size: 0.85em;
}

.bc-body {
    display: flex;
    min-height: 650px;
    background: white;
}

.bc-sidebar {
    width: 300px;
    background: var(--bc-dark);
    display: flex;
    flex-direction: column;
}

.bc-menu-btn {
    padding: 18px 22px;
    color: #d1d5db;
    background: none;
    border: none;
    text-align: left;
    cursor: pointer;
}

.bc-menu-btn:hover {
    background: rgba(255,255,255,0.05);
    color: white;
}

.bc-menu-btn.active {
    background: var(--bc-primary);
    color: white;
}

.bc-content {
    flex: 1;
    background: var(--bc-light);
    display: flex;
    flex-direction: column;
}

.bc-content-header {
    padding: 18px 25px;
    background: white;
    border-bottom: 1px solid #e5e7eb;
    font-weight: 600;
    color: var(--bc-primary);
}

.bc-iframe {
    flex: 1;
    border: none;
}
</style>
</head>

<body>

<div class="bc-panel">

<div class="bc-header">
    <div class="bc-header-content">
        <div class="bc-title">
            MESLEKİ BECERİ KOMİSYONU
        </div>

        <div class="bc-header-right">
            <a href="https://tip.bakircay.edu.tr/" class="bc-home-btn">
                Ana Sayfa
            </a>

            <img class="bc-logo"
            src="https://tip.bakircay.edu.tr/Yuklenenler/TIP%20FAK%C3%9CLTES%C4%B0/tip_logo.png">
        </div>
    </div>
</div>

<div class="bc-body">

<div class="bc-sidebar">

<button class="bc-menu-btn active"
data-title="Komisyon Hakkında"
data-content="<p>Tıp öğrencilerinin klinik öncesi ve staj dönemlerinde hekimlik uygulamalarını (damar yolu açma, enjeksiyon vb.) simülasyon temelli öğrenmelerini planlayan, 
    çalışma esasları ve yönergeleriyle yapılandırılan akademik kuruldur. Beceri laboratuvarı eğitimlerini, sınavlarını ve uygulama defterlerini yönetirler.</p>
    <style>
p {line-height: 1.6; text-align: justify;color: black};
 </style>
    ">
📋 Komisyon Hakkında
</button>

<button class="bc-menu-btn"
data-title="Üyeler"
data-content="<h3><u>MESLEKİ BECERİ KOMİSYONU</u></h3>
<li>Prof. Dr. Nimet ŞENOĞLU (Başkan)</li><br>
<li>Doç. Dr. Ramazan SABIRLI (Üye)</li><br>
<li>Doç. Dr. Hakan AYGÜN (Üye)</li><br>
<li>Doç. Dr. Fatma AKGÜL (Üye)</li><br>
<li>Doç. Dr. Suna YILDIRIM KARACA (Üye)</li><br>
<li>Doç. Dr. Hande GAZETECİ TEKİN (Üye)</li><br>
<li>Doç. Dr. Mustafa Ozan HORSANALI (Üye)</li><br>
<li>Dönem I Temsilcisi (Üye)</li><br>
<li>Dönem II Temsilcisi (Üye)</li><br>
<li>Dönem III Temsilcisi (Üye)</li><br>
">
👥 Üyeler
</button>

<button class="bc-menu-btn"
data-title="Çalışma Prensipleri"
data-content="<p><b>Çalışma Prensipleri</b></p>
    <li><b>Beceri Eğitimi Planlaması:</b> Tıp müfredatına uygun olarak, dönem 1-3 arası temel beceriler ve staj dönemleri (4-5) için klinik beceri eğitimlerini organize eder.</li><br>
    <li><b>Simülasyon Temelli Eğitim:</b> Eğitimleri maketler ve simülatörler üzerinde, güvenli bir ortamda beceri kazanılmasını sağlar.</li><br>
    <li><b>Ölçme ve Değerlendirme:</b> Mesleki beceri sınavlarını (OSCE/yapılandırılmış klinik sınavlar) hazırlar ve yürütür.</li><br>
    <li><b>Komisyon Yapısı:</b> Genellikle dekanlık tarafından atanan öğretim üyelerinden oluşur, dönem koordinatörleri ve öğrenci temsilcileriyle işbirliği yapar.</li><br>
    <li><b>Uygulama Defterleri:</b> Beceri eğitimlerinde öğrencilerin performansını kaydettikleri Mesleki Beceri Uygulama Defteri oluşturulmasını sağlar. </li><br>
    ">
⚙️ Çalışma Prensipleri
</button>

<button class="bc-menu-btn"
data-title="Mevzuat"
data-url="https://tip.bakircay.edu.tr/Yuklenenler/TIP%20FAK%C3%9CLTES%C4%B0/KOM%C4%B0SYON%20USUL%20VE%20ESASLARI/MESLEK%C4%B0_BECER%C4%B0_E%C4%9E%C4%B0T%C4%B0M%C4%B0_KOM%C4%B0SYONU.pdf">
📜 Mevzuat
</button>

<!-- YENİ EKLENENLER -->

<button class="bc-menu-btn"
data-title="Etkinlikler"
data-content="<h2></h2><p></p>">
📅 Etkinlikler
</button>

<button class="bc-menu-btn"
data-title="İletişim"
data-content="<h3>Mesleki Beceri Komisyonu Sekreteryası</h3>
<p>Ümit Doğan</p>
<p><b>E-posta:</b> umit.dogan@bakircay.edu.tr</p>
<p><b>Telefon:</b> (0232) 493 00 00 / 11310</p>">
📞 İletişim
</button>

</div>

<div class="bc-content">
<div class="bc-content-header" id="contentTitle">Komisyon Hakkında</div>
<iframe id="iframe" class="bc-iframe"></iframe>
</div>

</div>
</div>

<script>
const buttons = document.querySelectorAll(".bc-menu-btn");
const iframe = document.getElementById("iframe");
const title = document.getElementById("contentTitle");

buttons.forEach(btn => {
    btn.addEventListener("click", () => {

        buttons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        const url = btn.getAttribute("data-url");
        const content = btn.getAttribute("data-content");
        const text = btn.getAttribute("data-title");

        if (content) {
            const html = `
            <html>
            <head>
                <meta charset="UTF-8">
                <style>
                    body { font-family: Inter; padding: 40px; }
                </style>
            </head>
            <body>${content}</body>
            </html>`;
            iframe.src = "data:text/html;charset=utf-8," + encodeURIComponent(html);
        } else {
            iframe.src = url;
        }

        title.innerText = text;
    });
});

document.querySelector(".bc-menu-btn.active").click();
</script>

</body>
</html>
