<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Burs Komisyonu</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

:root {
    --bc-primary: #00a5b5;
    --bc-secondary: #025860;
    --bc-dark: #1f2937;
    --bc-light: #f8fafc;
}

.bc-panel {
    max-width: 1400px;
    margin: 30px auto;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.15);
}

.bc-header {
    position: relative;
    padding: 20px 25px;
    color: white;
    overflow: hidden;
}

.bc-header::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #00a5b5, #025860);
    z-index: 1;
}

.bc-header::after {
    content: "";
    position: absolute;
    inset: 0;
    backdrop-filter: blur(12px);
    background: rgba(255,255,255,0.05);
    z-index: 2;
}

.bc-header-content {
    position: relative;
    z-index: 3;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.bc-title {
    font-size: 1.2em;
    font-weight: 600;
}

.bc-header-right {
    display: flex;
    align-items: center;
    gap: 15px;
}

.bc-logo {
    height: 60px;
}

.bc-home-btn {
    padding: 8px 16px;
    background: rgba(255,255,255,0.15);
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-size: 0.85em;
}

.bc-body {
    display: flex;
    min-height: 650px;
    background: white;
}

.bc-sidebar {
    width: 300px;
    background: var(--bc-dark);
    display: flex;
    flex-direction: column;
}

.bc-menu-btn {
    padding: 18px 22px;
    color: #d1d5db;
    background: none;
    border: none;
    text-align: left;
    cursor: pointer;
}

.bc-menu-btn:hover {
    background: rgba(255,255,255,0.05);
    color: white;
}

.bc-menu-btn.active {
    background: var(--bc-primary);
    color: white;
}

.bc-content {
    flex: 1;
    background: var(--bc-light);
    display: flex;
    flex-direction: column;
}

.bc-content-header {
    padding: 18px 25px;
    background: white;
    border-bottom: 1px solid #e5e7eb;
    font-weight: 600;
    color: var(--bc-primary);
}

.bc-content-area {
    flex: 1;
    padding: 40px;
    overflow: auto;
    color: #111827;
}

.bc-content-area p,
.bc-content-area li {
    line-height: 1.6;
}

.bc-iframe {
    flex: 1;
    width: 100%;
    border: none;
}

.bc-iframe[hidden],
.bc-content-area[hidden] {
    display: none;
}
text{line-height: 1.6;}

</style>
<style id="mobile-layout-v2">

body { background: #edf3f5; }

.bc-title { min-width: 0; overflow-wrap: anywhere; line-height: 1.45; }
.bc-header-right { flex-shrink: 0; }

.bc-content-area[data-section="İletişim"] a { color: #025860; text-underline-offset: 3px; }
.bc-document-link { display: inline-flex; align-items: center; min-height: 44px; margin: 12px 16px; padding: 10px 14px; border-radius: 8px; background: #e2f4f4; color: #025860; font-size: .9rem; align-self: flex-start; }
.bc-document-link[hidden] { display: none; }
.bc-iframe { min-height: 600px; }
.bc-menu-btn:focus-visible, .bc-home-btn:focus-visible, .bc-back-menu:focus-visible, .bc-content-area a:focus-visible { outline: 3px solid #d98d00; outline-offset: -3px; }
@media (max-width: 1024px) {
 .bc-panel { margin: 12px auto; width: calc(100% - 24px); border-radius: 14px; }
 .bc-body { flex-direction: column; min-height: 0; }
 .bc-sidebar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; flex: none; width: 100%; padding: 12px; background: #e4edef; }
 .bc-menu-btn { padding: 12px 10px; border-radius: 9px; border: 1px solid #ccdce0; background: white; color: #304b56; font-weight: 500; }
 .bc-menu-btn:hover { color: #025860; background: #f0fafb; }
 .bc-menu-btn.active { background: #026d78; border-color: #026d78; color: white; }
 .bc-content { width: 100%; min-height: calc(100vh - 24px); min-height: calc(100svh - 24px); scroll-margin-top: 12px; }
 .bc-content-header { padding: 16px; }
 .bc-back-menu { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; min-height: 44px; padding: 8px 12px; border: 1px solid #ccdce0; border-radius: 8px; color: #025860; background: #f5fafb; cursor: pointer; font-size: .8rem; }
 .bc-content-area { flex: none; padding: 24px; }
 .bc-content-area p { text-align: left; }
 .bc-iframe { flex: none; width: 100%; height: 75vh; height: 75svh; min-height: 420px; }
}
@media (max-width: 600px) {
 .bc-header { padding: 18px 16px; }
 .bc-header-content { flex-direction: column; align-items: stretch; gap: 14px; }
 .bc-title { font-size: 1.08rem; }
 .bc-header-right { width: 100%; justify-content: space-between; gap: 12px; }
 .bc-logo { height: 48px; max-width: 45%; }
 .bc-sidebar { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 10px; }
 .bc-menu-btn { font-size: .84rem; }
 .bc-content-header { align-items: flex-start; font-size: .95rem; }
 .bc-content-heading { padding-top: 10px; }
 .bc-content-area { padding: 20px 16px; font-size: 1rem; }
 .bc-content-area h2 { font-size: 1.25rem; }
 .bc-content-area h3 { font-size: 1.1rem; }
 .bc-content-area .event-container { grid-template-columns: minmax(0, 1fr); gap: 16px; }
 .bc-content-area .event-body { padding: 16px; }
 .bc-content-area[data-section="İletişim"] b { display: block; margin-bottom: 4px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }

</style>
</head>

<script>
(() => {
 const buttons = [...document.querySelectorAll('.bc-menu-btn')];
 const iframe = document.getElementById('iframe');
 const area = document.getElementById('contentArea');
 const title = document.getElementById('contentTitle');
 const contentPanel = document.querySelector('.bc-content');
 const menu = document.querySelector('.bc-sidebar');
 const heading = document.createElement('span');
 heading.className = 'bc-content-heading';
 heading.setAttribute('role', 'heading');
 heading.setAttribute('aria-level', '2');
 heading.tabIndex = -1;
 const back = document.createElement('button');
 back.type = 'button'; back.className = 'bc-back-menu'; back.textContent = '↑ Menüye dön';
 title.replaceChildren(heading, back);
 const documentLink = document.createElement('a');
 documentLink.className = 'bc-document-link'; documentLink.textContent = 'Belgeyi yeni sekmede aç ↗';
 documentLink.target = '_blank'; documentLink.rel = 'noopener noreferrer'; documentLink.hidden = true;
 iframe.before(documentLink);
 menu.setAttribute('aria-label', 'Komisyon bölümleri');
 function scrollToElement(element) {
  element.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth', block: 'start'});
 }
 back.addEventListener('click', () => {
  const active = buttons.find(b => b.classList.contains('active'));
  active.focus({preventScroll: true}); scrollToElement(menu);
 });
 function show(btn, navigate) {
  buttons.forEach(b => { b.classList.toggle('active', b === btn); b.setAttribute('aria-pressed', String(b === btn)); });
  const label = btn.getAttribute('data-title');
  const html = btn.getAttribute('data-content');
  const url = btn.getAttribute('data-url');
  heading.textContent = label;
  area.dataset.section = label;
  iframe.hidden = true; iframe.removeAttribute('src'); iframe.removeAttribute('srcdoc');
  area.hidden = false; area.replaceChildren(); documentLink.hidden = true;
  if (html) {
   area.innerHTML = html;
   // Dynamic content styles must not override the responsive page layout.
   area.querySelectorAll('style').forEach(s => s.remove());
   if (!area.textContent.trim() && !area.querySelector('img')) {
    const empty = document.createElement('p'); empty.textContent = 'Henüz içerik eklenmemiştir.'; area.replaceChildren(empty);
   }
   if (label === 'İletişim') {
    const walker = document.createTreeWalker(area, NodeFilter.SHOW_TEXT);
    const texts = []; while(walker.nextNode()) texts.push(walker.currentNode);
    texts.forEach(node => {
     if (node.parentElement.closest('a')) return;
     const match = node.textContent.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i);
     if (!match) return;
     const link = document.createElement('a'); link.href = 'mailto:' + match[0]; link.textContent = match[0];
     node.replaceWith(document.createTextNode(node.textContent.slice(0,match.index)), link, document.createTextNode(node.textContent.slice(match.index + match[0].length)));
    });
   }
  } else if (url) {
   area.hidden = true; iframe.hidden = false; iframe.title = label; iframe.src = url;
   documentLink.href = url; documentLink.hidden = false;
  }
  if (navigate && matchMedia('(max-width: 1024px)').matches) {
   heading.focus({preventScroll: true});
   requestAnimationFrame(() => scrollToElement(contentPanel));
  }
 }
 buttons.forEach(btn => { btn.type = 'button'; btn.addEventListener('click', () => show(btn, true)); });
 show(buttons.find(b => b.classList.contains('active')) || buttons[0], false);
})();

</script>
