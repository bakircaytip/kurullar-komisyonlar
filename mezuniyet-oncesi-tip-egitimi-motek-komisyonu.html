<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

:root {
    --bc-primary: #00a5b5;
    --bc-secondary: #025860;
    --bc-dark: #1f2937;
    --bc-light: #f8fafc;
}

.bc-panel {
    max-width: 1400px;
    margin: 30px auto;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.15);
}

.bc-header {
    position: relative;
    padding: 20px 25px;
    color: white;
    overflow: hidden;
}

.bc-header::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #00a5b5, #025860);
    z-index: 1;
}

.bc-header::after {
    content: "";
    position: absolute;
    inset: 0;
    backdrop-filter: blur(12px);
    background: rgba(255,255,255,0.05);
    z-index: 2;
}

.bc-header-content {
    position: relative;
    z-index: 3;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.bc-title {
    font-size: 1.2em;
    font-weight: 600;
}

.bc-header-right {
    display: flex;
    align-items: center;
    gap: 15px;
}

.bc-logo {
    height: 60px;
}

.bc-home-btn {
    padding: 8px 16px;
    background: rgba(255,255,255,0.15);
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-size: 0.85em;
}

.bc-body {
    display: flex;
    min-height: 650px;
    background: white;
}

.bc-sidebar {
    width: 300px;
    background: var(--bc-dark);
    display: flex;
    flex-direction: column;
}

.bc-menu-btn {
    padding: 18px 22px;
    color: #d1d5db;
    background: none;
    border: none;
    text-align: left;
    cursor: pointer;
}

.bc-menu-btn:hover {
    background: rgba(255,255,255,0.05);
    color: white;
}

.bc-menu-btn.active {
    background: var(--bc-primary);
    color: white;
}

.bc-content {
    flex: 1;
    background: var(--bc-light);
    display: flex;
    flex-direction: column;
}

.bc-content-header {
    padding: 18px 25px;
    background: white;
    border-bottom: 1px solid #e5e7eb;
    font-weight: 600;
    color: var(--bc-primary);
}

.bc-iframe {
    flex: 1;
    border: none;
}
</style>
</head>

<body>

        </div>

        <div class="bc-header-right">
            <a href="https://tip.bakircay.edu.tr/" class="bc-home-btn">
                Ana Sayfa
            </a>

            <img class="bc-logo"
            src="https://tip.bakircay.edu.tr/Yuklenenler/TIP%20FAK%C3%9CLTES%C4%B0/tip_logo.png">

<button class="bc-menu-btn active"

data-content="<p>Mezuniyet Öncesi Tıp Eğitimi Koordinasyon Komisyonu (MÖTEK), tıp fakültelerinde eğitim programının planlanması, uygulanması, ölçme-değerlendirme 
    süreçlerinin yönetilmesi ve akreditasyon standartlarına göre iyileştirilmesiyle görevli akademik kuruldur. Eğitim kalitesini artırmayı hedefler.</p>
    <p><b>Komisyonun Temel Amaçları ve Görevleri:</b>
        <li><b>Eğitim Planlaması:</b> Tıp müfredatının güncellenmesi, ders içeriklerinin koordinasyonu ve dönemsel hedeflerin belirlenmesi.</li><br>
        <li><b>Koordinasyon:</b> Dönem 1-6 arası koordinatörler, başkoordinatör ve tıp eğitimi anabilim dalı temsilcileri arasında işbirliği sağlama.</li><br>
        <li><b>Ölçme ve Değerlendirme:</b> Sınav takvimlerinin, soru kalitelerinin ve değerlendirme yöntemlerinin akademik usullere uygunluğunu denetleme.</li><br>
        <li><b>İyileştirme ve Akreditasyon:</b> Eğitim programındaki zayıf yönleri tespit edip iyileştirme çalışmaları yapmak ve TEPDAD akreditasyon süreçlerine hazırlık sağlamak.</li><br>
        <li><b>Yönerge ve Esaslar:</b> Fakülte kurulu kararlarıyla belirlenen yönergeler çerçevesinde çalışmalarını yürütme.</li><br></p>

p {line-height: 1.6; text-align: justify;};

<li><b>Sürekli İyileştirme ve Değerlendirme:</b> Tıp eğitim programının amacını ve yeterliklerini belirleyerek, müfredatı düzenli olarak gözden geçirir ve günceller.</li><br>

<div class="bc-content">
<div class="bc-content-header" id="contentTitle">Komisyon Hakkında</div>
<iframe id="iframe" class="bc-iframe"></iframe>
</div>

</div>
</div>

<script>
const buttons = document.querySelectorAll(".bc-menu-btn");
const iframe = document.getElementById("iframe");
const title = document.getElementById("contentTitle");

buttons.forEach(btn => {
    btn.addEventListener("click", () => {

        buttons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        const url = btn.getAttribute("data-url");
        const content = btn.getAttribute("data-content");
        const text = btn.getAttribute("data-title");

        if (content) {
            const html = `
            <html>
            <head>
                <meta charset="UTF-8">
                <style>
                    body { font-family: Inter; padding: 40px; }
                </style>
            </head>
            <body>${content}</body>
            </html>`;
            iframe.src = "data:text/html;charset=utf-8," + encodeURIComponent(html);
        } else {
            iframe.src = url;
        }

        title.innerText = text;
    });
});

document.querySelector(".bc-menu-btn.active").click();
</script>
