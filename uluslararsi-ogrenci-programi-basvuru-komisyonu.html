<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Uluslararası Öğrenci Programı Başvuru ve Değerlendirme Komisyonu</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

:root {
    --bc-primary: #00a5b5;
    --bc-secondary: #025860;
    --bc-dark: #1f2937;
    --bc-light: #f8fafc;
}

.bc-panel {
    max-width: 1400px;
    margin: 30px auto;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.15);
}

.bc-header {
    position: relative;
    padding: 20px 25px;
    color: white;
    overflow: hidden;
}

.bc-header::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #00a5b5, #025860);
    z-index: 1;
}

.bc-header::after {
    content: "";
    position: absolute;
    inset: 0;
    backdrop-filter: blur(12px);
    background: rgba(255,255,255,0.05);
    z-index: 2;
}

.bc-header-content {
    position: relative;
    z-index: 3;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.bc-title {
    font-size: 1.2em;
    font-weight: 600;
}

.bc-header-right {
    display: flex;
    align-items: center;
    gap: 15px;
}

.bc-logo {
    height: 60px;
}

.bc-home-btn {
    padding: 8px 16px;
    background: rgba(255,255,255,0.15);
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-size: 0.85em;
}

.bc-body {
    display: flex;
    min-height: 650px;
    background: white;
}

.bc-sidebar {
    width: 300px;
    background: var(--bc-dark);
    display: flex;
    flex-direction: column;
}

.bc-menu-btn {
    padding: 18px 22px;
    color: #d1d5db;
    background: none;
    border: none;
    text-align: left;
    cursor: pointer;
}

.bc-menu-btn:hover {
    background: rgba(255,255,255,0.05);
    color: white;
}

.bc-menu-btn.active {
    background: var(--bc-primary);
    color: white;
}

.bc-content {
    flex: 1;
    background: var(--bc-light);
    display: flex;
    flex-direction: column;
}

.bc-content-header {
    padding: 18px 25px;
    background: white;
    border-bottom: 1px solid #e5e7eb;
    font-weight: 600;
    color: var(--bc-primary);
}

.bc-iframe {
    flex: 1;
    border: none;
}
</style>
</head>

<body>

<div class="bc-panel">

<div class="bc-header">
    <div class="bc-header-content">
        <div class="bc-title">
            ULUSLARARASI ÖĞRENCİ PROGRAMI BAŞVURU VE DEĞERLENDİRME KOMİSYONU
        </div>

        <div class="bc-header-right">
            <a href="https://tip.bakircay.edu.tr/" class="bc-home-btn">
                Ana Sayfa
            </a>

            <img class="bc-logo"
            src="https://tip.bakircay.edu.tr/Yuklenenler/TIP%20FAK%C3%9CLTES%C4%B0/tip_logo.png">
        </div>
    </div>
</div>

<div class="bc-body">

<div class="bc-sidebar">

<button class="bc-menu-btn active"

data-content="<p>Komisyon, yabancı uyruklu öğrencilerin fakülteye kabul süreçlerini yönetir. Komisyon, başvuruların incelenmesi, adayların değerlendirilmesi
     ve kontenjanların yönetilmesiyle ilgili yönerge ve usul esasları doğrultusunda çalışır.</p>
     <li><b>Amaç:</b> Uluslararası öğrencilerin başvuru, değerlendirme ve kabul süreçlerini şeffaf ve belirli kurallara göre yönetmek.</li><br>

p {line-height: 1.6; text-align: justify;color: black};
 </style>
        ">

<button class="bc-menu-btn"
data-title="Çalışma Prensipleri"
data-content="<p>Çalışma ilkeleri, İzmir Bakırçay Üniversitesi senato kararları ve YÖK (Yükseköğretim Kurulu) mevzuatına dayanır.</p>
<p><b>Temel Çalışma İlkeleri</b></p>
<li><b>Şeffaflık ve Hesap Verebilirlik:</b> Başvuru kriterleri, kontenjanlar ve değerlendirme sonuçları açıkça ilan edilir.</li><br>
<li><b>Adil ve Eşit Değerlendirme:</b> Adaylar uyruklarına bakılmaksızın, akademik liyakat (lise not ortalaması, YÖS, SAT vb.) temelinde eşit koşullarda değerlendirilir.</li><br>
<li><b>Gizlilik:</b> Adayların kişisel verileri ve başvuru dosyaları KVKK (Kişisel Verilerin Korunması Kanunu) kapsamında gizli tutulur.</li><br>
<li><b>Katılımcılık:</b> Komisyon, farklı ana bilim dallarından gelen temsilcilerle geniş temsiliyetle çalışır.</li><br>
<p><b>Başvuru Değerlendirme Süreci</b></p>
<li><b>Dosya İnceleme:</b> Komisyon, adayların lise diploması, transkript ve uluslararası geçerliliği olan sınav sonuçlarını (SAT, ACT, IB, YÖS vb.) inceler.</li><br>
<li><b>Denklik Kontrolü:</b> Adayların lise eğitiminin Türkiye'deki tıp fakültesi giriş şartlarına denkliği kontrol edilir.</li><br>
<li><b>Dil Yeterliliği:</b> Türkçe veya İngilizce tıp programları için gerekli dil yeterlilik belgeleri (TÖMER vb.) kontrol edilir.</li><br>
<li><b>Sıralama ve Kabul:</b> Kontenjan dahilinde en yüksek puanlı adaydan başlanarak kabul listesi ve yedek liste oluşturulur.</li><br>
<p><b>Toplantı ve Karar Esasları</b></p>
<li>Komisyon, başvuru dönemlerinde düzenli olarak toplanır ve tutanak tutar.</li><br>
<li>Kararlar oy birliğiyle ile alınır.</li><br>
<li>Komisyon üyeleri, görevlerini kalite geliştirme ve iç kontrol sistemi prensiplerine uygun olarak yürütür.</li><br>
">
⚙️ Çalışma Prensipleri
</button>

<button class="bc-menu-btn"

<div class="bc-content">
<div class="bc-content-header" id="contentTitle">Komisyon Hakkında</div>
<iframe id="iframe" class="bc-iframe"></iframe>
</div>

</div>
</div>

<script>
const buttons = document.querySelectorAll(".bc-menu-btn");
const iframe = document.getElementById("iframe");
const title = document.getElementById("contentTitle");

buttons.forEach(btn => {
    btn.addEventListener("click", () => {

        buttons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        const url = btn.getAttribute("data-url");
        const content = btn.getAttribute("data-content");
        const text = btn.getAttribute("data-title");

        if (content) {
            const html = `
            <html>
            <head>
                <meta charset="UTF-8">
                <style>
                    body { font-family: Inter; padding: 40px; }
                </style>
            </head>
            <body>${content}</body>
            </html>`;
            iframe.src = "data:text/html;charset=utf-8," + encodeURIComponent(html);
        } else {
            iframe.src = url;
        }

        title.innerText = text;
    });
});

document.querySelector(".bc-menu-btn.active").click();
</script>

</body>
</html>
