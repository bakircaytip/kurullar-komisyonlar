<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>İnternet ve Sosyal Medya Komisyonu</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

:root {
    --bc-primary: #00a5b5;
    --bc-secondary: #025860;
    --bc-dark: #1f2937;
    --bc-light: #f8fafc;
}

.bc-panel {
    max-width: 1400px;
    margin: 30px auto;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.15);
}

.bc-header {
    position: relative;
    padding: 20px 25px;
    color: white;
    overflow: hidden;
}

.bc-header::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #00a5b5, #025860);
    z-index: 1;
}

.bc-header::after {
    content: "";
    position: absolute;
    inset: 0;
    backdrop-filter: blur(12px);
    background: rgba(255,255,255,0.05);
    z-index: 2;
}

.bc-header-content {
    position: relative;
    z-index: 3;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.bc-title {
    font-size: 1.2em;
    font-weight: 600;
}

.bc-header-right {
    display: flex;
    align-items: center;
    gap: 15px;
}

.bc-logo {
    height: 60px;
}

.bc-home-btn {
    padding: 8px 16px;
    background: rgba(255,255,255,0.15);
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-size: 0.85em;
}

.bc-body {
    display: flex;
    min-height: 650px;
    background: white;
}

.bc-sidebar {
    width: 300px;
    background: var(--bc-dark);
    display: flex;
    flex-direction: column;
}

.bc-menu-btn {
    padding: 18px 22px;
    color: #d1d5db;
    background: none;
    border: none;
    text-align: left;
    cursor: pointer;
}

.bc-menu-btn:hover {
    background: rgba(255,255,255,0.05);
    color: white;
}

.bc-menu-btn.active {
    background: var(--bc-primary);
    color: white;
}

.bc-content {
    flex: 1;
    background: var(--bc-light);
    display: flex;
    flex-direction: column;
}

.bc-content-header {
    padding: 18px 25px;
    background: white;
    border-bottom: 1px solid #e5e7eb;
    font-weight: 600;
    color: var(--bc-primary);
}

.bc-iframe {
    flex: 1;
    border: none;
}
</style>
</head>

<body>

<div class="bc-panel">

<div class="bc-header">
    <div class="bc-header-content">
        <div class="bc-title">
            İNTERNET VE SOSYAL MEDYA KOMİSYONU
        </div>

        <div class="bc-header-right">
            <a href="https://tip.bakircay.edu.tr/" class="bc-home-btn">
                Ana Sayfa
            </a>

            <img class="bc-logo"
            src="https://tip.bakircay.edu.tr/Yuklenenler/TIP%20FAK%C3%9CLTES%C4%B0/tip_logo.png">
        </div>
    </div>
</div>

<div class="bc-body">

<div class="bc-sidebar">

<button class="bc-menu-btn active"
data-title="Komisyon Hakkında"
data-content="<p>Fakültemizin dijital iletişim faaliyetlerini planlayan, yöneten ve denetleyen akademik-idari bir organdır. 
    Temel amaçları; kurumsal kimliği korumak, doğru duyurular yapmak ve etkileşimi artırmaktır. Stratejik iletişim birimi işlevi görür, 
    kalite güvencesi süreçlerine katkı sağlar, akreditasyon süreçlerinde önemlidir.</p>
    <style>
p {line-height: 1.6; text-align: justify;color: black};
 </style>
    ">
📋 Komisyon Hakkında
</button>

<button class="bc-menu-btn"
data-title="Üyeler"
data-content="<h3><u>İNTERNET VE SOSYAL MEDYA KOMİSYONU</u></h3>
<li>Dr. Öğr. Üyesi Levent ELMAS (Başkan)</li><br>
<li>Doç. Dr. Enis HİDİŞOĞLU (Üye)</li><br>
<li>Öğr. Gör. Dr. Sezgi Fırat ÖZGÜR (Üye)</li><br>
<li>Çağdaş ÜZBEY (Üye)</li><br>
">
👥 Üyeler
</button>

<button class="bc-menu-btn"
data-title="Çalışma Prensipleri"
data-content="<p><b>Çalışma Prensipleri</b></p>
<li><b>Kurumsal Yetki ve Sorumluluk İlkesi:</b> Komisyon, faaliyetlerini dekanlık / fakülte yönetimi adına yürütür. Tüm içerikler kurumsal kimliği temsil eder; 
    bireysel görüş içermez. Paylaşımlar resmi hesaplar üzerinden ve yetkilendirilmiş kişilerce yapılır. Bu ilke, kurumsal itibarın korunmasının temelidir.</li><br>
<li><b>Doğruluk ve Güvenirlilik İlkesi:</b> Yayınlanan tüm bilgiler, doğru, güncel, doğrulanmış kaynaklara dayalı olmalıdır. Yanlış veya eksik bilgi paylaşımı 
    durumunda hızlı düzeltme mekanizması işletilir. Bu ilke etik ve hukuki sorumluluk doğurur.</li><br>
<li><b>Kurumsal Kimlik ve Standartlaşma:</b> Tüm içerikler, üniversitenin kurumsal kimlik kılavuzuna uygun olmalıdır. logo, renk, yazı dili ve format açısından standart olmalıdır.
    Kullanılan dil, resmi, akademik, anlaşılır olmalıdır. Bu ilke marka bütünlüğünü sağlar.</li><br>
">
⚙️ Çalışma Prensipleri
</button>

<button class="bc-menu-btn"
data-title="Mevzuat"
data-url="https://tip.bakircay.edu.tr/Yuklenenler/TIP%20FAK%C3%9CLTES%C4%B0/KOM%C4%B0SYON%20USUL%20VE%20ESASLARI/%C4%B0NTERNET_VE_SOSYAL_MEDYA_KOM%C4%B0SYO.pdf">
📜 Mevzuat
</button>

<!-- YENİ EKLENENLER -->

<button class="bc-menu-btn"
data-title="Etkinlikler"
data-content="<h2></h2><p></p>">
📅 Etkinlikler
</button>

<button class="bc-menu-btn"
data-title="İletişim"
data-content="<h3>İnternet ve Sosyal Medya Komisyonu Sekreteryası</h3>
<p>Çağdaş Üzbey</p>
<p><b>E-posta:</b> cagdas.uzbey@bakircay.edu.tr</p>
<p><b>Telefon:</b> (0232) 493 00 00 / 11026</p>">
📞 İletişim
</button>

</div>

<div class="bc-content">
<div class="bc-content-header" id="contentTitle">Komisyon Hakkında</div>
<iframe id="iframe" class="bc-iframe"></iframe>
</div>

</div>
</div>

<script>
const buttons = document.querySelectorAll(".bc-menu-btn");
const iframe = document.getElementById("iframe");
const title = document.getElementById("contentTitle");

buttons.forEach(btn => {
    btn.addEventListener("click", () => {

        buttons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        const url = btn.getAttribute("data-url");
        const content = btn.getAttribute("data-content");
        const text = btn.getAttribute("data-title");

        if (content) {
            const html = `
            <html>
            <head>
                <meta charset="UTF-8">
                <style>
                    body { font-family: Inter; padding: 40px; }
                </style>
            </head>
            <body>${content}</body>
            </html>`;
            iframe.src = "data:text/html;charset=utf-8," + encodeURIComponent(html);
        } else {
            iframe.src = url;
        }

        title.innerText = text;
    });
});

document.querySelector(".bc-menu-btn.active").click();
</script>

</body>
</html>
